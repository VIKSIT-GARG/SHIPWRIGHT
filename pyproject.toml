[project]
name = "shipwright"
version = "0.1.0"
description = "Terminal-first autonomous issue-to-PR agent"
requires-python = ">=3.11"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Shipwright contributors" }]
keywords = ["agents", "automation", "github", "coding-agent", "ollama", "tui"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Software Development :: Bug Tracking",
]
dependencies = [
  "textual>=0.80,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
shipwright = "shipwright.tui:main"
shipwright-chat = "shipwright.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
