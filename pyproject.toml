[project]
name = "shipwright"
version = "0.1.0"
description = "Terminal-first autonomous issue-to-PR agent"
requires-python = ">=3.11,<4.0"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Shipwright contributors" }]
keywords = ["agents", "automation", "github", "coding-agent", "ollama", "tui"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Software Development :: Bug Tracking",
]
dependencies = [
  "textual>=0.80,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
default-groups = ["dev"]

[project.scripts]
shipwright = "shipwright.tui:main"
shipwright-chat = "shipwright.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = [
  "setuptools==75.8.0",
  "wheel==0.45.1",
]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["shipwright*"]
